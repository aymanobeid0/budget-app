# Checks every pull request; on every push to main, also builds a signed
# release APK and publishes it as a GitHub Release. Obtainium on the phone
# watches the Releases page and installs each new build.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  base64 of android/upload-keystore.jks
#   ANDROID_KEY_PROPERTIES   contents of android/key.properties
#   DOTENV                   contents of .env (Supabase keys); optional,
#                            without it the build runs offline only

name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # creating Releases

env:
  FLUTTER_VERSION: "3.47.7" # Keep in step with .claude/hooks/session-start.sh

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Restore signing key and .env
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::Signing secrets are missing; a debug-signed APK could not update the installed app."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          printf '%s\n' "$DOTENV" > .env

      # The run number is the versionCode, so every build installs as an
      # update over the one before. 64-bit ARM only (every phone since about
      # 2017): one engine instead of three, about 21 MB instead of 61 MB.
      # Obfuscation trims the code and hides its symbols; the symbol map stays
      # out of the APK, in build/debug-info.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/debug-info \
            --dart-define-from-file=.env \
            --build-number=${{ github.run_number }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          TAG="v${VERSION}-build.${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "monex-${TAG}.apk"
          gh release create "$TAG" "monex-${TAG}.apk" \
            --title "Monex ${VERSION} (build ${{ github.run_number }})" \
            --notes "$(git log -1 --pretty=%s)" \
            --target "${{ github.sha }}" \
            --latest
